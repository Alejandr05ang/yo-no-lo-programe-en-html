[project]
name = "tutorias-backend"
version = "0.1.0"
description = "Autoridad de Tutorías de Verano: FastAPI, Firebase identity, PostgreSQL"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic==1.20.0",
  "asyncpg==0.31.0",
  "fastapi==0.141.1",
  "firebase-admin==7.6.0",
  "httpx==0.28.1",
  "pillow==12.3.0",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.32",
  "sqlalchemy==2.0.54",
  "uvicorn==0.53.0",
]

[dependency-groups]
dev = [
  "aiosqlite==0.22.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"app/**" = ["B008"]
